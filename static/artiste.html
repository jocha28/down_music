<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil artiste — Sonauto Downloader</title>
<style>
  :root {
    --bg: #121212; --bg2: #181818; --bg3: #282828;
    --border: #2a2a2a; --accent: #7c3aed; --accent2: #a855f7;
    --green: #1db954; --red: #e22134;
    --text: #fff; --text2: #b3b3b3; --text3: #6a6a6a;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Circular', 'Inter', system-ui, sans-serif; overflow-x: hidden; }

  /* ── TOPBAR ── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 300;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; background: transparent; transition: background .4s;
  }
  .topbar.scrolled { background: rgba(18,18,18,.96); backdrop-filter: blur(12px); }
  .topbar-left { display: flex; gap: 8px; }
  .nav-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.5); border: none; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .nav-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .topbar-title { font-weight: 700; font-size: 1rem; opacity: 0; transition: opacity .3s; }
  .topbar.scrolled .topbar-title { opacity: 1; }
  .topbar-right { display: flex; gap: 10px; align-items: center; }
  .topbar-link { font-size: .8rem; color: var(--text2); text-decoration: none; padding: 6px 16px; border-radius: 99px; border: 1px solid var(--border); transition: all .15s; }
  .topbar-link:hover { color: #fff; border-color: #fff; }

  /* ── HERO plein-écran ── */
  .hero { position: relative; height: 340px; overflow: hidden; cursor: pointer; }
  .hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
  .hero-overlay { position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(18,18,18,.4) 70%, var(--bg) 100%); }
  .hero-color-bg { position: absolute; inset: 0; opacity: 0; transition: opacity .5s; }
  .hero-input { display: none; }
  .hero-edit-hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,.7); color: #fff; padding: 10px 20px; border-radius: 99px;
    font-size: .85rem; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none;
    white-space: nowrap;
  }
  .hero:hover .hero-edit-hint { opacity: 1; }
  .hero-meta { position: absolute; bottom: 20px; left: 32px; }
  .verified-badge { display: flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; color: #3d91f4; margin-bottom: 10px; }
  .verified-badge svg { color: #3d91f4; }
  .hero-name { font-size: clamp(3rem, 7vw, 6rem); font-weight: 900; letter-spacing: -.03em; line-height: 1; text-shadow: 0 2px 32px rgba(0,0,0,.5); }
  .hero-listeners { font-size: .9rem; color: var(--text2); margin-top: 10px; }

  /* ── ACTIONS BAR ── */
  .actions { display: flex; align-items: center; gap: 20px; padding: 24px 32px 16px; }
  .play-big { width: 56px; height: 56px; border-radius: 50%; background: var(--green); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .1s, filter .1s; box-shadow: 0 8px 24px rgba(29,185,84,.4); }
  .play-big:hover { transform: scale(1.06); filter: brightness(1.1); }
  .shuffle-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 4px; transition: color .15s; }
  .shuffle-btn:hover { color: #fff; }
  .follow-btn { padding: 8px 24px; border-radius: 99px; border: 1px solid var(--text2); background: transparent; color: #fff; font-size: .875rem; font-weight: 700; cursor: pointer; transition: all .15s; letter-spacing: .04em; }
  .follow-btn:hover { border-color: #fff; transform: scale(1.02); }
  .follow-btn.on { color: var(--green); border-color: var(--green); }
  .more-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1.4rem; padding: 4px 8px; letter-spacing: .06em; transition: color .15s; }
  .more-btn:hover { color: #fff; }

  /* ── CONTENU ── */
  .page { padding: 0 32px 120px; }

  /* ── POPULAR + ARTIST PICK ── */
  .two-col { display: grid; grid-template-columns: 1fr 340px; gap: 40px; margin-bottom: 48px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  .section-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 16px; }

  /* ── TABLE SONS ── */
  .songs-table { width: 100%; }
  .song-row { display: grid; grid-template-columns: 28px 42px 1fr auto; align-items: center; gap: 14px; padding: 8px 16px 8px 8px; border-radius: 4px; cursor: default; transition: background .1s; }
  .song-row:hover { background: var(--bg3); }
  .song-row.playing .song-name { color: var(--green); }
  .song-row .num { text-align: right; font-size: .9rem; color: var(--text2); font-variant-numeric: tabular-nums; }
  .song-row:hover .num { display: none; }
  .song-row:hover .play-icon { display: flex !important; }
  .play-icon { display: none; align-items: center; justify-content: flex-end; cursor: pointer; }
  .song-cover { width: 42px; height: 42px; border-radius: 3px; background: var(--bg3); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: .9rem; flex-shrink: 0; }
  .song-cover img { width: 100%; height: 100%; object-fit: cover; }
  .song-name { font-size: .9375rem; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-sub { font-size: .78rem; color: var(--text2); margin-top: 2px; }
  .song-right { display: flex; align-items: center; gap: 14px; }
  .like-btn { background: none; border: none; cursor: pointer; color: var(--text3); opacity: 0; transition: opacity .15s, color .15s; padding: 3px; }
  .song-row:hover .like-btn { opacity: 1; }
  .like-btn.on { color: var(--green); opacity: 1; }
  .duration { font-size: .82rem; color: var(--text2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .voir-plus-btn { background: none; border: none; color: var(--text2); font-size: .8rem; font-weight: 700; cursor: pointer; padding: 14px 8px; letter-spacing: .05em; text-transform: uppercase; transition: color .15s; }
  .voir-plus-btn:hover { color: #fff; }

  /* ── ARTIST PICK ── */
  .artist-pick { display: flex; flex-direction: column; gap: 10px; }
  .pick-card {
    position: relative; border-radius: 10px; overflow: hidden; cursor: pointer;
    aspect-ratio: 16/9; background: var(--bg3);
  }
  /* Fond = cover du son, flouté/assombri */
  .pick-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform .4s; }
  .pick-card:hover .pick-bg { transform: scale(1.03); }
  .pick-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,.6) 100%); }
  /* Contenu au-dessus */
  .pick-content { position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
  /* Haut : avatar + bulle */
  .pick-top { display: flex; align-items: flex-start; gap: 10px; }
  .pick-ava-small {
    width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #1a1a2e);
    display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    border: 2px solid rgba(255,255,255,.25); box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .pick-ava-small img { width: 100%; height: 100%; object-fit: cover; }
  .pick-bubble {
    background: rgba(255,255,255,.92); color: #000; border-radius: 99px;
    padding: 8px 14px; font-size: .82rem; font-weight: 600; max-width: 200px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    position: relative; line-height: 1.3;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  /* Bas : vignette + titre + play */
  .pick-bottom { display: flex; align-items: flex-end; gap: 12px; }
  .pick-thumb-img {
    width: 72px; height: 72px; border-radius: 6px; flex-shrink: 0; overflow: hidden;
    background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; box-shadow: 0 4px 16px rgba(0,0,0,.6);
  }
  .pick-thumb-img img { width: 100%; height: 100%; object-fit: cover; }
  .pick-bottom-info { flex: 1; min-width: 0; }
  .pick-title { font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .pick-meta { font-size: .78rem; color: rgba(255,255,255,.7); margin-top: 3px; font-weight: 500; }
  .pick-play { width: 48px; height: 48px; border-radius: 50%; background: var(--green); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  .pick-card:hover .pick-play { opacity: 1; transform: translateY(0); }
  .pick-no-pick { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text3); font-size: .85rem; }
  .pick-msg-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: #fff; padding: 8px 10px; font-size: .8rem; font-family: inherit; resize: none; outline: none; }
  .pick-msg-input:focus { border-color: var(--text2); }

  /* ── DISCOGRAPHIE ── */
  .disco-filters { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-btn { padding: 7px 18px; border-radius: 99px; border: none; background: var(--bg3); color: var(--text2); font-size: .82rem; font-weight: 700; cursor: pointer; transition: all .15s; }
  .filter-btn.active { background: #fff; color: #000; }
  .filter-btn:hover:not(.active) { background: #3a3a3a; color: #fff; }

  .disco-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
  .disco-card { background: var(--bg2); padding: 16px; border-radius: var(--radius); cursor: pointer; transition: background .15s; position: relative; }
  .disco-card:hover { background: var(--bg3); }
  .disco-cover { width: 100%; aspect-ratio: 1; border-radius: 4px; background: var(--bg3); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-bottom: 14px; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .disco-cover img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .disco-play { position: absolute; bottom: 8px; right: 8px; width: 44px; height: 44px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .disco-card:hover .disco-play { opacity: 1; transform: translateY(0); }
  .disco-name { font-size: .875rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .disco-year { font-size: .78rem; color: var(--text2); margin-top: 4px; }
  .disco-type-badge { display: inline-block; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; margin-left: 6px; }
  .disco-type-badge.album  { background: rgba(29,185,84,.15); color: var(--green); }
  .disco-type-badge.ep     { background: rgba(124,58,237,.2); color: var(--accent2); }
  .disco-type-badge.single { background: rgba(255,255,255,.1); color: var(--text2); }

  /* ── ABOUT ── */
  /* ── ABOUT CARD (style Spotify) ── */
  .about-card {
    border-radius: 12px; overflow: hidden; position: relative;
    min-height: 320px; cursor: pointer;
    background: var(--bg2);
  }
  .about-card-bg {
    position: absolute; inset: 0; background-size: cover; background-position: center top;
    filter: brightness(.35) saturate(.6);
  }
  .about-card-overlay { position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(0,0,0,.55) 100%); }
  .about-card-content { position: relative; padding: 32px; display: flex; flex-direction: column; min-height: 320px; }
  .about-avatar {
    width: 128px; height: 128px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), #1a1a2e);
    display: flex; align-items: center; justify-content: center; font-size: 3rem;
    box-shadow: 0 4px 24px rgba(0,0,0,.5); cursor: pointer;
  }
  .about-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .about-bottom { margin-top: auto; padding-top: 60px; }
  .about-listeners { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
  .about-bio { font-size: .875rem; color: var(--text2); line-height: 1.65; max-width: 520px; }
  .bio-edit { width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 4px; color: #fff; padding: 10px 12px; font-size: .875rem; font-family: inherit; resize: vertical; outline: none; min-height: 80px; margin-top: 8px; display: none; }
  .bio-edit.visible { display: block; }
  .bio-edit:focus { border-color: var(--text2); }
  .edit-bio-btn { background: none; border: 1px solid rgba(255,255,255,.25); color: var(--text2); padding: 5px 14px; border-radius: 99px; font-size: .75rem; cursor: pointer; margin-top: 10px; transition: all .15s; }
  .edit-bio-btn:hover { border-color: #fff; color: #fff; }

  /* ── PLAYER BOTTOM ── */
  .player { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(var(--bg2), #0e0e0e); border-top: 1px solid var(--border); display: none; align-items: center; padding: 0 24px; gap: 20px; z-index: 400; }
  .player.on { display: flex; }
  .player-thumb { width: 56px; height: 56px; border-radius: 3px; flex-shrink: 0; overflow: hidden; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  .player-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .player-info { width: 200px; min-width: 0; }
  .player-title { font-size: .875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-artist { font-size: .75rem; color: var(--text2); }
  .player-mid { flex: 1; display: flex; align-items: center; gap: 12px; }
  audio { flex: 1; height: 32px; accent-color: var(--green); }
  .player-lyrics-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 6px; border-radius: 4px; transition: color .15s; flex-shrink: 0; }
  .player-lyrics-btn:hover, .player-lyrics-btn.on { color: var(--green); }
  .player-close { background: none; border: none; color: var(--text3); cursor: pointer; padding: 6px; flex-shrink: 0; transition: color .15s; }
  .player-close:hover { color: #fff; }

  /* ── LYRICS FULLSCREEN ── */
  .lyrics-fs {
    position: fixed; inset: 0; z-index: 500; display: none;
    align-items: center; justify-content: center;
    background: #1a0040;
    transition: background .8s;
  }
  .lyrics-fs.on { display: flex; }
  .lyrics-fs-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(80px) brightness(.3) saturate(2); transform: scale(1.1); }
  .lyrics-fs-gradient { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .lyrics-content { position: relative; max-width: 720px; width: 100%; padding: 80px 32px 160px; overflow-y: auto; max-height: 100vh; scrollbar-width: none; }
  .lyrics-content::-webkit-scrollbar { display: none; }
  .lrc-line { font-size: clamp(1.4rem, 3vw, 2.4rem); font-weight: 700; line-height: 1.4; padding: 8px 0; color: rgba(255,255,255,.35); cursor: pointer; transition: color .3s, transform .3s; }
  .lrc-line.active { color: #fff; transform: scale(1.02); }
  .lrc-line.passe { color: rgba(255,255,255,.5); }
  .lyrics-close { position: fixed; top: 24px; right: 24px; background: rgba(0,0,0,.5); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: background .15s; }
  .lyrics-close:hover { background: rgba(255,255,255,.15); }
  .lyrics-no-lrc { color: rgba(255,255,255,.5); font-size: 1.1rem; text-align: center; padding: 60px 20px; }

  /* ── SÉLECTEUR ── */
  .picker { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; gap: 24px; padding: 40px; }
  .picker h1 { font-size: 1.8rem; font-weight: 900; }
  .picker-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 900px; }
  .pick-artist-card { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 16px; background: var(--bg2); border-radius: var(--radius); cursor: pointer; transition: background .15s; width: 160px; }
  .pick-artist-card:hover { background: var(--bg3); }
  .pick-ava { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; background: linear-gradient(135deg, var(--accent), #1a1a2e); }
  .pick-ava img { width: 100%; height: 100%; object-fit: cover; }
  .pick-name { font-weight: 700; font-size: .9rem; text-align: center; }
  .pick-count { font-size: .75rem; color: var(--text2); }

  /* ── TOAST ── */
  #toasts { position: fixed; bottom: 90px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 600; }
  .toast { background: #333; border-radius: 4px; padding: 12px 16px; font-size: .85rem; max-width: 300px; box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: tin .25s; }
  @keyframes tin { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  .spin { animation: sp .8s linear infinite; display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .hero-meta { left: 16px; }
    .actions { padding: 20px 16px 12px; gap: 14px; }
    .page { padding: 0 16px 120px; }
    .hero-name { font-size: 2.8rem; }
    .player-info { display: none; }
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<nav class="topbar" id="topbar">
  <div class="topbar-left">
    <button class="nav-btn" onclick="history.back()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav-btn" onclick="history.forward()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <span class="topbar-title" id="topTitle"></span>
  <div class="topbar-right">
    <a href="#" class="topbar-link" id="editProfilLink" style="display:none" onclick="ouvrirEditeur()">Modifier le profil</a>
    <a href="/static/album.html" class="topbar-link">Albums</a>
    <a href="/static/editeur.html" class="topbar-link">Éditeur</a>
    <a href="/" class="topbar-link">Accueil</a>
  </div>
</nav>

<!-- SÉLECTEUR D'ARTISTE -->
<div class="picker" id="picker" style="display:none">
  <h1>Choisir un artiste</h1>
  <div class="picker-grid" id="pickerGrid"><div class="spin">⟳</div></div>
</div>

<!-- PROFIL PRINCIPAL -->
<div id="profile" style="display:none; padding-bottom:90px">

  <!-- HERO -->
  <div class="hero" id="hero" onclick="document.getElementById('heroInput').click()" title="Cliquer pour changer la photo">
    <img class="hero-img" id="heroImg" src="" alt="" style="display:none" onerror="this.style.display='none'">
    <div class="hero-color-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-edit-hint">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Changer la photo
    </div>
    <div class="hero-meta">
      <div class="verified-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        Artiste vérifié
      </div>
      <div class="hero-name" id="heroName">–</div>
      <div class="hero-listeners" id="heroListeners"></div>
    </div>
  </div>
  <input type="file" class="hero-input" id="heroInput" accept="image/*" onchange="changerHero(this)">

  <!-- ACTIONS -->
  <div class="actions">
    <button class="play-big" onclick="jouerTout()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <button class="shuffle-btn" onclick="this.style.color=this.style.color==='rgb(29, 185, 84)'?'var(--text2)':'#1db954'" title="Aléatoire">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
    </button>
    <button class="follow-btn" id="followBtn" onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'Suivi(e)':'Suivre'">Suivre</button>
    <button class="more-btn">···</button>
  </div>

  <!-- CONTENU TABLESS (scrollable) -->
  <div class="page">

    <!-- POPULAIRES + ARTIST PICK -->
    <div class="two-col">

      <!-- Sons populaires -->
      <div>
        <div class="section-title">Populaires</div>
        <div id="popularList"></div>
        <button class="voir-plus-btn" id="voirPlusBtn" onclick="voirTout()" style="display:none">Voir tout</button>

      <!-- Artist pick -->
      <div class="artist-pick">

          <!-- Fond cover -->
          <div class="pick-bg" id="pickBg"></div>

          <div class="pick-content" id="pickContent">

        <div style="display:flex;gap:8px;align-items:center">
          <select id="pickSelect" style="flex:1;background:var(--bg3);border:1px solid var(--border);color:#fff;padding:7px 10px;border-radius:4px;font-size:.8rem;outline:none;" onchange="changerPick(this.value)">
            <option value="">— Choisir le son mis en avant —</option>

    <!-- DISCOGRAPHIE -->
    <div style="margin-bottom:48px">

        <div class="section-title">Discographie</div>
        <a href="/static/album.html" style="font-size:.82rem;font-weight:600;color:var(--text2);text-decoration:none;text-transform:uppercase;letter-spacing:.06em;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text2)'">Créer</a>
      </div>
      <div class="disco-filters">
        <button class="filter-btn active" onclick="filtrerDisco('tout',this)">Sorties populaires</button>
        <button class="filter-btn" onclick="filtrerDisco('album',this)">Albums</button>
        <button class="filter-btn" onclick="filtrerDisco('ep',this)">Singles et EPs</button>
      </div>
      <div class="disco-grid" id="discoGrid"></div>
      <div id="noAlbums" style="display:none;color:var(--text2);font-size:.9rem;padding:24px 0">
        Aucune sortie — <a href="/static/album.html" style="color:var(--green);text-decoration:none">créer un album →</a>
      </div>
    </div>

    <!-- À PROPOS -->
    <div style="margin-bottom:48px">
      <div class="section-title">À propos</div>
      <div class="about-card" id="aboutCard">
        <div class="about-card-bg" id="aboutBg"></div>
        <div class="about-card-overlay"></div>
        <div class="about-card-content">
          <!-- Avatar circulaire -->
          <div class="about-avatar" id="aboutAvatar" onclick="event.stopPropagation();document.getElementById('aboutPhotoInput').click()" title="Changer la photo">
            <span id="aboutAvaEmoji">🎤</span>
            <img id="aboutAvaImg" style="display:none" alt="">
          </div>
          <input type="file" id="aboutPhotoInput" accept="image/*" style="display:none" onchange="changerAboutPhoto(this)">
          <!-- Bas de la carte -->
          <div class="about-bottom">
            <div class="about-listeners" id="aboutSons">–</div>
            <div class="about-bio" id="bioPara">Aucune biographie. Cliquez sur Modifier pour en ajouter une.</div>
            <textarea class="bio-edit" id="bioEdit" placeholder="Écrire une biographie…"></textarea>
            <button class="edit-bio-btn" id="editBioBtn" onclick="event.stopPropagation();toggleBio()">Modifier</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- MINI PLAYER -->
<div class="player" id="playerBar">
  <div class="player-thumb" id="playerThumb">🎵</div>
  <div class="player-info">
    <div class="player-title" id="playerTitle">–</div>
    <div class="player-artist" id="playerArtist">–</div>
  </div>
  <div class="player-mid">
    <audio id="audio" controls></audio>
  </div>
  <button class="player-lyrics-btn" id="lyricsToggleBtn" onclick="toggleLyrics()" title="Paroles">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
  <button class="player-close" onclick="stopPlayer()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<!-- LYRICS FULLSCREEN -->
<div class="lyrics-fs" id="lyricsFs">
  <div class="lyrics-fs-bg" id="lyricsBg"></div>
  <div class="lyrics-fs-gradient"></div>
  <div class="lyrics-content" id="lyricsContent"></div>
  <button class="lyrics-close" onclick="toggleLyrics()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
</div>

<div id="toasts"></div>

<script>
const API = '';
let data      = null;   // { nom, sons, albums }
let profilInfo = {};    // données sauvegardées côté serveur
let sons      = [];
let shown     = 10;
let playIdx   = -1;
let pickSon   = null;
let lyricsOpen = false;
let lrcLines  = [];
let lastLrcIdx = -1;
const BIO_KEY = 'artist_bio_';

// ── UTILS ──────────────────────────────────────────────────────────────────

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
async function get(path) {
  const r = await fetch(API + '/api' + path);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}
function dur(s) { if (!s) return '–'; return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

// ── SCROLL ─────────────────────────────────────────────────────────────────
window.addEventListener('scroll', () =>
  document.getElementById('topbar').classList.toggle('scrolled', scrollY > 260)
);

// ── SÉLECTEUR ──────────────────────────────────────────────────────────────
async function showPicker() {
  document.getElementById('picker').style.display = 'flex';
  try {
    const artistes = await get('/artistes');
    const el = document.getElementById('pickerGrid');
    if (!artistes.length) { el.innerHTML = '<p style="color:var(--text2)">Aucun artiste — définissez l\'artiste dans l\'éditeur de tags.</p>'; return; }
    el.innerHTML = artistes.map(a => {
      const cover = a.cover_exemple ? `/api/fichiers/${encodeURIComponent(a.cover_exemple)}/cover` : '';
      return `<div class="pick-artist-card" onclick="load('${encodeURIComponent(a.nom)}')">
        <div class="pick-ava">${cover ? `<img src="${cover}" onerror="this.parentElement.innerHTML='🎤'" alt="">` : '🎤'}</div>
        <div class="pick-name">${a.nom}</div>
        <div class="pick-count">${a.nb_sons} sons · ${a.nb_albums} albums</div>
      </div>`;
    }).join('');
  } catch(e) { document.getElementById('pickerGrid').innerHTML = `<span style="color:var(--red)">${e.message}</span>`; }
}

// ── CHARGEMENT ─────────────────────────────────────────────────────────────
async function load(nomEnc) {
  const nom = decodeURIComponent(nomEnc);
  document.getElementById('picker').style.display = 'none';
  document.getElementById('profile').style.display = 'block';
  try {
    [data, profilInfo] = await Promise.all([
      get(`/artistes/${encodeURIComponent(nom)}/profil`),
      get(`/artistes/${encodeURIComponent(nom)}/info`).catch(() => ({})),
    ]);
    sons = data.sons;
    render();
    history.replaceState(null, '', `?artiste=${encodeURIComponent(nom)}`);
    // Afficher le bouton "Modifier le profil"
    const lien = document.getElementById('editProfilLink');
    lien.style.display = '';
    lien._nom = nom;
  } catch(e) { toast('Erreur : ' + e.message); }
}

function ouvrirEditeur() {
  const lien = document.getElementById('editProfilLink');
  const nom = lien._nom || (data && data.nom) || '';
  window.location.href = `/static/profil_editeur.html?artiste=${encodeURIComponent(nom)}`;
}

function render() {
  const { nom, sons: s, albums } = data;

  // Stats hero
  document.getElementById('heroListeners').textContent = `${s.length} sons`;

  // Hero image : priorité à la photo_banniere du profil, sinon premier son avec cover
  const avecCover = s.find(x => x.cover_url);
  const banniereUrl = profilInfo.photo_banniere || (avecCover && avecCover.cover_url) || '';
  if (banniereUrl) {
    const img = document.getElementById('heroImg');
    img.src = banniereUrl;
    img.style.display = 'block';
    document.getElementById('lyricsBg').style.backgroundImage = `url('${banniereUrl}')`;
  }

  // Nom affiché (depuis le profil si défini)
  const nomAffiche = profilInfo.nom_affiche || nom;
  document.getElementById('heroName').textContent  = nomAffiche;
  document.title = nomAffiche + ' — Sonauto Downloader';
  document.getElementById('topTitle').textContent = nomAffiche;

  // Bio : priorité profil serveur, sinon localStorage
  const bioServeur = profilInfo.bio || '';
  const bioSaved   = bioServeur || localStorage.getItem(BIO_KEY + nom) || '';
  document.getElementById('bioEdit').value = bioSaved;
  document.getElementById('bioPara').textContent = bioSaved || 'Aucune biographie. Cliquez sur Modifier pour en ajouter une.';
  document.getElementById('bioPara').style.color = bioSaved ? 'var(--text2)' : 'var(--text3)';

  // Stats About
  document.getElementById('aboutSons').textContent = `${s.length} sons · ${albums.length} album${albums.length!==1?'s':''}`;

  // Avatar About : priorité photo_avatar du profil, sinon cover du premier son
  const avatarUrl = profilInfo.photo_avatar || (avecCover && avecCover.cover_url) || '';
  const bgUrl     = profilInfo.photo_banniere || (avecCover && avecCover.cover_url) || '';
  if (bgUrl)     document.getElementById('aboutBg').style.backgroundImage  = `url('${bgUrl}')`;
  if (avatarUrl) {
    document.getElementById('aboutAvaImg').src = avatarUrl;
    document.getElementById('aboutAvaImg').style.display = 'block';
    document.getElementById('aboutAvaEmoji').style.display = 'none';
  }

  // Artist Pick depuis le profil
  if (profilInfo.pick_son) {
    const sel = document.getElementById('pickSelect');
    // sera rempli juste après ; on mémorise pour appliquer après
    data._savedPickSon = profilInfo.pick_son;
    data._savedPickMsg = profilInfo.pick_message || '';
  }

  // Populaires
  renderPopular();

  // Pick select
  const sel = document.getElementById('pickSelect');
  sel.innerHTML = '<option value="">— Choisir le son mis en avant —</option>' +
    s.map(x => `<option value="${encodeURIComponent(x.nom)}">${x.titre}</option>`).join('');

  // Restaurer le pick depuis le profil serveur
  if (data._savedPickSon) {
    const opt = [...sel.options].find(o => decodeURIComponent(o.value) === data._savedPickSon);
    if (opt) {
      sel.value = opt.value;
      const msgEl = document.getElementById('pickMsg');
      if (msgEl && data._savedPickMsg) msgEl.value = data._savedPickMsg;
      // Rendu avec message
      const s = sons.find(x => x.nom === data._savedPickSon);
      if (s) { pickSon = s; _renderPickCard(s, data._savedPickMsg || ''); }
    }
  }

  // Discographie
  renderDisco('tout');
}

// ── POPULAIRES ──────────────────────────────────────────────────────────────

function renderPopular(liste) {
  liste = liste ?? sons.slice(0, shown);
  const el = document.getElementById('popularList');
  el.innerHTML = liste.map((s, i) => `
    <div class="song-row${playIdx === i ? ' playing' : ''}" data-i="${i}">
      <div class="num">${i+1}</div>
      <div class="play-icon" onclick="play(${i})"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      <div class="song-cover">${s.cover_url ? `<img src="${s.cover_url}" onerror="this.parentElement.innerHTML='🎵'" loading="lazy" alt="">` : '🎵'}</div>
      <div ondblclick="play(${i})" style="min-width:0">
        <div class="song-name">${s.titre}</div>
        <div class="song-sub">${s.album || ''}</div>
      </div>
      <div class="song-right">
        <button class="like-btn" onclick="this.classList.toggle('on')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
        <span class="duration">${dur(s.duree)}</span>
      </div>
    </div>`).join('');
  document.getElementById('voirPlusBtn').style.display = sons.length > shown ? '' : 'none';
}

function voirTout() { shown = sons.length; renderPopular(); }

// ── DISCOGRAPHIE ─────────────────────────────────────────────────────────────

let discoFiltre = 'tout';
function filtrerDisco(f, btn) {
  discoFiltre = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderDisco(f);
}

function renderDisco(filtre) {
  const albums = data.albums;
  const grid   = document.getElementById('discoGrid');
  const noAlb  = document.getElementById('noAlbums');

  let filtres = albums;
  if (filtre === 'album')  filtres = albums.filter(a => (a.type||'album') === 'album');
  if (filtre === 'ep')     filtres = albums.filter(a => ['ep','single'].includes(a.type||'album'));

  if (!filtres.length) { grid.innerHTML = ''; noAlb.style.display = ''; return; }
  noAlb.style.display = 'none';

  grid.innerHTML = filtres.map((a, i) => {
    const type  = a.type || 'album';
    const badge = { album: 'Album', ep: 'EP', single: 'Single' }[type] || 'Album';
    const urlSortie = `/static/sortie.html?artiste=${encodeURIComponent(data.nom)}&album=${encodeURIComponent(a.titre)}`;
    return `<div class="disco-card" onclick="window.location.href='${urlSortie}'">
      <div class="disco-cover">
        ${a.cover ? `<img src="${a.cover}" onerror="this.parentElement.innerHTML='💿'" loading="lazy" alt="">` : '💿'}
        <button class="disco-play" onclick="event.stopPropagation();playAlbum(${albums.indexOf(a)})">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
      </div>
      <div class="disco-name">${a.titre}</div>
      <div class="disco-year">${a.annee || '–'} · <span class="disco-type-badge ${type}">${badge}</span></div>
    </div>`;
  }).join('');
}

function filtrerParAlbum(albEnc) {
  const alb    = decodeURIComponent(albEnc);
  const filtres = sons.filter(s => s.album === alb);
  shown = filtres.length;
  renderPopular(filtres.map((s, i) => ({ ...s, _origIdx: sons.indexOf(s) })));
  document.getElementById('voirPlusBtn').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── ARTIST PICK ─────────────────────────────────────────────────────────────

function changerPick(nomEnc) {
  if (!nomEnc) { _renderPickVide(); return; }
  const s = sons.find(x => encodeURIComponent(x.nom) === nomEnc);
  if (!s) return;
  pickSon = s;
  _renderPickCard(s, document.getElementById('pickMsg').value.trim());
}

function mettreAJourBulle(msg) {
  const el = document.getElementById('pickBubble');
  if (el) el.textContent = msg.trim() || '♪';
}

function _renderPickVide() {
  pickSon = null;
  document.getElementById('pickBg').style.backgroundImage = '';
  document.getElementById('pickContent').innerHTML = '<div class="pick-no-pick">Sélectionner un son ci-dessous</div>';
}

function _renderPickCard(s, msg) {
  // Fond cover
  if (s.cover_url) document.getElementById('pickBg').style.backgroundImage = `url('${s.cover_url}')`;

  // Avatar de l'artiste (photo de profil ou emoji)
  const avatarHtml = (profilInfo && profilInfo.photo_avatar)
    ? `<img src="${profilInfo.photo_avatar}" alt="" onerror="this.parentElement.innerHTML='🎤'">`
    : '🎤';

  // Bulle message
  const bulle = msg || '♪';

  // Vignette du son
  const thumbHtml = s.cover_url
    ? `<img src="${s.cover_url}" onerror="this.parentElement.innerHTML='🎵'" alt="">`
    : '🎵';

  // Type (Album / EP / Single)
  const typeLabel = s.type_sortie
    ? ({ album: 'Album', ep: 'EP', single: 'Single' }[s.type_sortie] || s.type_sortie)
    : (s.album || '–');

  document.getElementById('pickContent').innerHTML = `
    <div class="pick-top">
      <div class="pick-ava-small">${avatarHtml}</div>
      <div class="pick-bubble" id="pickBubble">${bulle}</div>
    </div>
    <div class="pick-bottom">
      <div class="pick-thumb-img">${thumbHtml}</div>
      <div class="pick-bottom-info">
        <div class="pick-title">${s.titre}</div>
        <div class="pick-meta">${typeLabel}</div>
      </div>
      <button class="pick-play" onclick="event.stopPropagation();jouerPick()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
    </div>`;
}

function jouerPick() { if (pickSon) { const i = sons.indexOf(pickSon); if (i >= 0) play(i); } }

// ── LECTURE ──────────────────────────────────────────────────────────────────

function play(i) {
  const s = sons[i]; if (!s) return;
  playIdx = i;
  const audio = document.getElementById('audio');
  audio.src   = s.audio_url;
  document.getElementById('playerTitle').textContent  = s.titre;
  document.getElementById('playerArtist').textContent = s.artiste || data.nom;
  const th = document.getElementById('playerThumb');
  th.innerHTML = s.cover_url ? `<img src="${s.cover_url}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='🎵'" alt="">` : '🎵';
  document.getElementById('playerBar').classList.add('on');
  audio.play();
  // Lyrics bg
  if (s.cover_url) document.getElementById('lyricsBg').style.backgroundImage = `url('${s.cover_url}')`;
  document.querySelectorAll('.song-row').forEach(r => r.classList.remove('playing'));
  const row = document.querySelector(`.song-row[data-i="${i}"]`);
  if (row) { row.classList.add('playing'); }
  // Charger les lyrics si ouvertes
  if (lyricsOpen) chargerLyrics(s.nom);
}

function playAlbum(i) {
  const pistes = data.albums[i]?.pistes;
  if (!pistes?.length) return;
  const idx = sons.findIndex(s => s.nom === pistes[0].nom);
  if (idx >= 0) play(idx);
}

function jouerTout() { if (sons.length) play(0); }
function stopPlayer() { document.getElementById('audio').pause(); document.getElementById('playerBar').classList.remove('on'); if (lyricsOpen) toggleLyrics(); }

document.getElementById('audio').addEventListener('ended', () => {
  if (playIdx >= 0 && playIdx < sons.length - 1) play(playIdx + 1);
});

// ── LYRICS FULLSCREEN ────────────────────────────────────────────────────────

function _parseLRC(text) {
  const lines = []; const re = /^\[(\d{2}):(\d{2})[.:](\d{2,3})\](.*)/;
  for (const l of text.split('\n')) {
    const m = l.match(re);
    if (m) {
      const frac = m[3].length === 3 ? +m[3]/1000 : +m[3]/100;
      lines.push({ t: +m[1]*60 + +m[2] + frac, txt: m[4] || '' });
    } else if (l.trim() && lines.length) lines[lines.length-1].txt += '\n' + l;
  }
  return lines;
}

async function chargerLyrics(nomFichier) {
  const content = document.getElementById('lyricsContent');
  content.innerHTML = '<div style="color:rgba(255,255,255,.5);padding:60px 0;text-align:center">Chargement…</div>';
  lrcLines = []; lastLrcIdx = -1;
  try {
    const r = await fetch(`/api/fichiers/${encodeURIComponent(nomFichier)}/lyrics`);
    if (!r.ok) throw new Error();
    const { lyrics } = await r.json();
    lrcLines = _parseLRC(lyrics);
    if (lrcLines.length) {
      content.innerHTML = '';
      lrcLines.forEach((l, i) => {
        const div = document.createElement('div');
        div.className = 'lrc-line'; div.dataset.i = i;
        div.style.whiteSpace = 'pre-wrap';
        div.textContent = l.txt.trim() || '♪';
        if (!l.txt.trim()) div.style.opacity = '.3';
        div.onclick = () => { document.getElementById('audio').currentTime = l.t; document.getElementById('audio').play(); };
        content.appendChild(div);
      });
      syncLyrics();
    } else {
      content.innerHTML = `<div class="lyrics-no-lrc">${lyrics.slice(0,2000)}</div>`;
    }
  } catch { content.innerHTML = '<div class="lyrics-no-lrc">Paroles non disponibles</div>'; }
}

function syncLyrics() {
  const audio = document.getElementById('audio');
  const t = audio.currentTime;
  let idx = -1;
  for (let i = 0; i < lrcLines.length; i++) { if (lrcLines[i].t <= t) idx = i; else break; }
  if (idx === lastLrcIdx) return;
  lastLrcIdx = idx;
  document.querySelectorAll('.lrc-line').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('passe', i < idx);
  });
  if (idx >= 0) {
    const el = document.querySelector(`.lrc-line[data-i="${idx}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

document.getElementById('audio').addEventListener('timeupdate', () => { if (lyricsOpen) syncLyrics(); });

function toggleLyrics() {
  lyricsOpen = !lyricsOpen;
  const fs = document.getElementById('lyricsFs');
  const btn = document.getElementById('lyricsToggleBtn');
  fs.classList.toggle('on', lyricsOpen);
  btn.classList.toggle('on', lyricsOpen);
  if (lyricsOpen && playIdx >= 0) chargerLyrics(sons[playIdx].nom);
}

// ── HERO / ABOUT PHOTO ───────────────────────────────────────────────────────

function changerHero(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = e => {
    const img = document.getElementById('heroImg');
    img.src = e.target.result; img.style.display = 'block';
    document.getElementById('lyricsBg').style.backgroundImage = `url('${e.target.result}')`;
  }; r.readAsDataURL(f);
}

function changerAboutPhoto(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = e => {
    document.getElementById('aboutAvaImg').src = e.target.result;
    document.getElementById('aboutAvaImg').style.display = 'block';
    document.getElementById('aboutAvaEmoji').style.display = 'none';
    document.getElementById('aboutBg').style.backgroundImage = `url('${e.target.result}')`;
  }; r.readAsDataURL(f);
}

// ── BIO ─────────────────────────────────────────────────────────────────────

function toggleBio() {
  const edit = document.getElementById('bioEdit');
  const para = document.getElementById('bioPara');
  const btn  = document.getElementById('editBioBtn');
  const editing = edit.classList.toggle('visible');
  if (editing) { btn.textContent = 'Enregistrer'; edit.focus(); }
  else {
    const val = edit.value.trim();
    localStorage.setItem(BIO_KEY + data.nom, val);
    para.textContent = val || 'Aucune biographie.';
    para.style.color = val ? 'var(--text2)' : 'var(--text3)';
    btn.textContent = 'Modifier';
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────────

const params = new URLSearchParams(location.search);
const a = params.get('artiste');
if (a) load(a); else showPicker();
</script>
</body>
</html>
