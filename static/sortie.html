<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album — Sonauto Downloader</title>
<style>
  :root {
    --bg: #121212; --bg2: #181818; --bg3: #282828;
    --border: #2a2a2a; --accent: #7c3aed;
    --green: #1db954; --red: #e22134;
    --text: #fff; --text2: #b3b3b3; --text3: #6a6a6a;
    --radius: 8px;
    --hero-color: #4a2040;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Circular','Inter',system-ui,sans-serif; overflow-x: hidden; }

  /* ── TOPBAR ── */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 300;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; background: transparent; transition: background .4s;
  }
  .topbar.scrolled { background: rgba(18,18,18,.96); backdrop-filter: blur(12px); }
  .topbar-left { display: flex; gap: 8px; align-items: center; }
  .nav-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.5); border: none; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .nav-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .topbar-right { display: flex; gap: 10px; align-items: center; }
  .topbar-link { font-size: .8rem; color: var(--text2); text-decoration: none; padding: 6px 16px; border-radius: 99px; border: 1px solid var(--border); transition: all .15s; }
  .topbar-link:hover { color: #fff; border-color: #fff; }

  /* ── HERO ── */
  .hero {
    padding: 80px 24px 24px;
    background: linear-gradient(var(--hero-color) 0%, rgba(18,18,18,0) 100%);
    display: flex; align-items: flex-end; gap: 24px; min-height: 280px;
    position: relative; overflow: hidden;
  }
  .hero-cover {
    width: 192px; height: 192px; flex-shrink: 0; border-radius: 4px;
    overflow: hidden; background: var(--bg3);
    display: flex; align-items: center; justify-content: center; font-size: 4rem;
    box-shadow: 0 16px 48px rgba(0,0,0,.6); position: relative; z-index: 1;
  }
  .hero-cover img { width: 100%; height: 100%; object-fit: cover; }
  .hero-meta { min-width: 0; position: relative; z-index: 1; }
  .hero-type { font-size: .8rem; font-weight: 700; margin-bottom: 10px; }
  .hero-title { font-size: clamp(2rem, 5vw, 4rem); font-weight: 900; letter-spacing: -.02em; line-height: 1.05; margin-bottom: 14px; }
  .hero-info { display: flex; align-items: center; gap: 8px; font-size: .875rem; flex-wrap: wrap; }
  .hero-ava { width: 24px; height: 24px; border-radius: 50%; overflow: hidden; background: var(--bg3); display: inline-flex; align-items: center; justify-content: center; font-size: .7rem; flex-shrink: 0; }
  .hero-ava img { width: 100%; height: 100%; object-fit: cover; }
  .hero-artist { font-weight: 700; cursor: pointer; }
  .hero-artist:hover { text-decoration: underline; }
  .hero-dot { color: var(--text3); }
  .hero-sub { color: var(--text2); }

  /* ── GRADIENT FADE → BG ── */
  .hero-fade {
    height: 232px; margin-top: -1px;
    background: linear-gradient(rgba(18,18,18,0) 0%, var(--bg) 100%);
  }

  /* ── ACTIONS ── */
  .actions { display: flex; align-items: center; gap: 20px; padding: 0 24px 24px; margin-top: -200px; position: relative; }
  .play-big { width: 56px; height: 56px; border-radius: 50%; background: var(--green); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .1s, filter .1s; box-shadow: 0 8px 24px rgba(29,185,84,.4); }
  .play-big:hover { transform: scale(1.06); filter: brightness(1.1); }
  .shuffle-btn, .more-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 4px; transition: color .15s; }
  .shuffle-btn:hover, .more-btn:hover { color: #fff; }

  /* ── TRACKLIST ── */
  .page { padding: 0 24px 120px; }
  /* colonnes : # | titre+artiste | plays | like+durée */
  .tracks-header,
  .track-row {
    display: grid;
    grid-template-columns: 32px 1fr minmax(80px,120px) minmax(60px,90px);
    align-items: center; gap: 8px;
    padding: 0 16px;
  }
  .tracks-header {
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
    font-size: .72rem; color: var(--text3); font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .track-row {
    padding-top: 8px; padding-bottom: 8px;
    border-radius: 4px; cursor: default; transition: background .1s;
  }
  .track-row:hover { background: var(--bg3); }
  .track-row.playing .track-name { color: var(--green); }
  .track-row.playing .track-num  { color: var(--green); }

  /* col 1 : numéro / play au survol */
  .track-num  { text-align: right; font-size: .875rem; color: var(--text2); font-variant-numeric: tabular-nums; }
  .track-play { display: none; align-items: center; justify-content: flex-end; cursor: pointer; color: #fff; }
  .track-row:hover .track-num  { display: none; }
  .track-row:hover .track-play { display: flex !important; }

  /* col 2 : titre + artiste */
  .track-name   { font-size: .9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: .78rem; color: var(--text2); margin-top: 2px; }

  /* col 3 : plays */
  .track-plays {
    font-size: .82rem; color: var(--text2);
    font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap;
  }
  .track-plays.zero { color: var(--text3); }

  /* col 4 : ♡ + durée */
  .track-right  { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .like-btn { background: none; border: none; cursor: pointer; color: var(--text3); opacity: 0; transition: opacity .15s, color .15s; padding: 3px; }
  .track-row:hover .like-btn { opacity: 1; }
  .like-btn.on { color: var(--green); opacity: 1; }
  .duration { font-size: .82rem; color: var(--text2); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── FOOTER RELEASE ── */
  .release-footer { padding: 24px 16px 48px; color: var(--text3); font-size: .75rem; line-height: 1.9; }
  .release-footer .date { color: var(--text2); font-weight: 500; margin-bottom: 4px; }

  /* ── MORE BY ── */
  .more-section { margin-bottom: 48px; }
  .more-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .more-title { font-size: 1.35rem; font-weight: 700; }
  .see-all { font-size: .82rem; font-weight: 700; color: var(--text2); text-decoration: none; letter-spacing: .05em; text-transform: uppercase; }
  .see-all:hover { color: #fff; }
  .more-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .more-scroll::-webkit-scrollbar { display: none; }
  .more-card { flex-shrink: 0; width: 160px; background: var(--bg2); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: background .15s; position: relative; }
  .more-card:hover { background: var(--bg3); }
  .more-cover { width: 100%; aspect-ratio: 1; border-radius: 4px; background: var(--bg3); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-bottom: 14px; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .more-cover img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .more-play { position: absolute; bottom: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .more-card:hover .more-play { opacity: 1; transform: translateY(0); }
  .more-name { font-size: .875rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more-year { font-size: .78rem; color: var(--text2); margin-top: 4px; }
  .type-badge { display: inline-block; font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; }
  .type-badge.album  { background: rgba(29,185,84,.15); color: var(--green); }
  .type-badge.ep     { background: rgba(124,58,237,.2); color: #a855f7; }
  .type-badge.single { background: rgba(255,255,255,.1); color: var(--text2); }

  /* ── PLAYER ── */
  .player {
    position: fixed; bottom: 0; left: 0; right: 0; height: 90px;
    background: #181818; border-top: 1px solid #282828;
    display: none; z-index: 400;
    grid-template-columns: 1fr 2fr 1fr; align-items: center; padding: 0 16px;
  }
  .player.on { display: grid; }
  .player-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .player-thumb { width: 56px; height: 56px; border-radius: 4px; flex-shrink: 0; overflow: hidden; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
  .player-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .player-info { min-width: 0; flex: 1; }
  .player-title  { font-size: .875rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-artist { font-size: .75rem; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-center { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .player-controls { display: flex; align-items: center; gap: 20px; }
  .ctrl-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; transition: color .15s, transform .1s; }
  .ctrl-btn:hover { color: #fff; transform: scale(1.08); }
  .ctrl-btn.active { color: var(--green); }
  .pp-btn { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .1s; }
  .pp-btn:hover { transform: scale(1.07); }
  .player-progress { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 560px; }
  .p-time { font-size: .68rem; color: var(--text2); font-variant-numeric: tabular-nums; min-width: 34px; text-align: center; }
  .progress-bar { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; cursor: pointer; outline: none; background: linear-gradient(to right, #fff 0%, #fff var(--pct,0%), #4d4d4d var(--pct,0%), #4d4d4d 100%); transition: height .1s; }
  .progress-bar:hover { height: 6px; }
  .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .15s; }
  .progress-bar:hover::-webkit-slider-thumb { opacity: 1; }
  .progress-bar::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: none; opacity: 0; }
  .progress-bar:hover::-moz-range-thumb { opacity: 1; }
  .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .vol-bar { width: 80px; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; cursor: pointer; outline: none; background: linear-gradient(to right, #fff 0%, #fff var(--pct,100%), #4d4d4d var(--pct,100%), #4d4d4d 100%); }
  .vol-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .vol-bar::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: none; }

  /* ── TOASTS ── */
  .toasts { position: fixed; bottom: 96px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 500; }
  .toast { background: var(--bg3); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: .85rem; box-shadow: 0 4px 16px rgba(0,0,0,.4); animation: fadeInUp .2s ease; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .spin { animation: sp .8s linear infinite; display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ── COVER BG (hero uniquement) ── */
  .cover-bg {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    filter: blur(60px) brightness(.3) saturate(1.5);
    transform: scale(1.08);
    opacity: 0; transition: opacity 1s ease;
  }
  .cover-bg.visible { opacity: 1; }

  /* ── LYRICS SPOTIFY STYLE ── */
  .player-lyrics-btn { background: none; border: none; color: var(--text2); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; transition: color .15s; }
  .player-lyrics-btn:hover, .player-lyrics-btn.on { color: var(--green); }

  .lyrics-fs {
    position: fixed; inset: 0 0 90px 0; z-index: 450;
    display: none; background: #121212;
  }
  .lyrics-fs.on { display: flex; }
  .lyrics-layout { display: flex; width: 100%; height: 100%; }

  /* zone paroles */
  .lyrics-zone {
    flex: 1; overflow-y: auto; padding: 80px 80px 40px;
    scrollbar-width: none; display: flex; align-items: flex-start;
  }
  .lyrics-zone::-webkit-scrollbar { display: none; }
  .lyrics-content { max-width: 640px; width: 100%; }
  .lrc-line {
    font-size: clamp(1.6rem, 2.8vw, 2.6rem); font-weight: 700;
    line-height: 1.45; padding: 6px 0; cursor: pointer;
    color: rgba(255,255,255,.25);
    transition: color .25s, transform .25s;
  }
  .lrc-line:hover { color: rgba(255,255,255,.5); }
  .lrc-line.active { color: #fff; transform: scale(1.01); }
  .lrc-line.passe  { color: rgba(255,255,255,.45); }

  /* panneau NP à droite */
  .lyrics-np {
    width: 320px; flex-shrink: 0; border-left: 1px solid #2a2a2a;
    padding: 32px 24px; overflow-y: auto; scrollbar-width: thin;
    scrollbar-color: #333 transparent; display: flex; flex-direction: column; gap: 24px;
  }
  .lyrics-np-artist { font-size: .78rem; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .1em; }
  .lyrics-np-cover { width: 100%; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #282828; }
  .lyrics-np-cover img { width: 100%; height: 100%; object-fit: cover; }
  .lyrics-np-title { font-size: 1rem; font-weight: 700; }
  .lyrics-np-sub   { font-size: .82rem; color: var(--text2); margin-top: 2px; }
  .lyrics-np-about { background: #1a1a1a; border-radius: 8px; padding: 16px; }
  .lyrics-np-about-title { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text2); margin-bottom: 14px; }
  .lyrics-np-avatar { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: #282828; margin-bottom: 12px; }
  .lyrics-np-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .lyrics-np-name { font-weight: 700; font-size: .9rem; margin-bottom: 8px; }
  .lyrics-np-bio { font-size: .78rem; color: var(--text2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 5; line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }

  .lyrics-close {
    position: absolute; top: 16px; left: 24px; background: rgba(0,0,0,.5);
    border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    z-index: 10; transition: background .15s;
  }
  .lyrics-close:hover { background: rgba(255,255,255,.15); }

  /* ── SHELL MODE ── */
  body.in-shell .player { display: none !important; }
  body.in-shell { padding-bottom: 0 !important; }
</style>
</head>
<body>

<!-- TOPBAR -->
<nav class="topbar" id="topbar">
  <div class="topbar-left">
    <button class="nav-btn" onclick="history.back()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav-btn" onclick="history.forward()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="topbar-right">
    <a href="/static/artiste.html" class="topbar-link" id="artisteLink">Artiste</a>
    <a href="/static/album.html" class="topbar-link">Créer un album</a>
    <a href="/" class="topbar-link">Accueil</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero" id="hero">
  <div class="cover-bg" id="coverBg"></div>
  <div class="hero-cover" id="heroCover">💿</div>
  <div class="hero-meta">
    <div class="hero-type" id="heroType">Album</div>
    <div class="hero-title" id="heroTitle">–</div>
    <div class="hero-info">
      <div class="hero-ava" id="heroAva">🎤</div>
      <span class="hero-artist" id="heroArtist" onclick="allerArtiste()">–</span>
      <span class="hero-dot">•</span>
      <span class="hero-sub" id="heroYear">–</span>
      <span class="hero-dot">•</span>
      <span class="hero-sub" id="heroCount">–</span>
    </div>
  </div>
</div>
<div class="hero-fade"></div>

<!-- ACTIONS -->
<div class="actions">
  <button class="play-big" onclick="jouerTout()" title="Lire">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
  </button>
  <button class="shuffle-btn" onclick="jouerAleatoire()" title="Aléatoire">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
  </button>
  <button class="more-btn" title="Plus d'options">•••</button>
</div>

<!-- TRACKLIST -->
<div class="page">
  <div class="tracks-header">
    <span style="text-align:right">#</span>
    <span>Titre</span>
    <span style="text-align:right">Plays</span>
    <span style="text-align:right">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </span>
  </div>
  <div id="trackList"></div>

  <!-- FOOTER RELEASE -->
  <div class="release-footer" id="releaseFooter" style="display:none">
    <div class="date" id="releaseDate"></div>
    <div id="releaseCopy"></div>
  </div>

  <!-- MORE BY ARTIST -->
  <div class="more-section" id="moreSection" style="display:none">
    <div class="more-header">
      <div class="more-title" id="moreTitle">Autres sorties</div>
      <a href="#" class="see-all" id="seeAllLink">Voir la discographie</a>
    </div>
    <div class="more-scroll" id="moreScroll"></div>
  </div>
</div>

<!-- LYRICS SPOTIFY STYLE -->
<div class="lyrics-fs" id="lyricsFs" style="position:fixed">
  <button class="lyrics-close" onclick="toggleLyrics()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
  <div class="lyrics-layout">
    <div class="lyrics-zone">
      <div class="lyrics-content" id="lyricsContent"></div>
    </div>
    <div class="lyrics-np" id="lyricsNP">
      <div class="lyrics-np-artist" id="lyricsNpArtist"></div>
      <div class="lyrics-np-cover" id="lyricsNpCover"></div>
      <div>
        <div class="lyrics-np-title" id="lyricsNpTitle"></div>
        <div class="lyrics-np-sub"   id="lyricsNpSub"></div>
      </div>
      <div class="lyrics-np-about">
        <div class="lyrics-np-about-title">À propos de l'artiste</div>
        <div class="lyrics-np-avatar" id="lyricsNpAvatar"></div>
        <div class="lyrics-np-name"   id="lyricsNpName"></div>
        <div class="lyrics-np-bio"    id="lyricsNpBio"></div>
      </div>
    </div>
  </div>
</div>

<!-- PLAYER -->
<audio id="audio"></audio>
<div class="player" id="playerBar">
  <div class="player-left">
    <div class="player-thumb" id="playerThumb">🎵</div>
    <div class="player-info">
      <div class="player-title"  id="playerTitle">–</div>
      <div class="player-artist" id="playerArtist">–</div>
    </div>
  </div>
  <div class="player-center">
    <div class="player-controls">
      <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Aléatoire">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      </button>
      <button class="ctrl-btn" onclick="playPrev()" title="Précédent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="pp-btn" id="ppBtn" onclick="togglePlay()">
        <svg id="ppIcon" width="16" height="16" viewBox="0 0 24 24" fill="#000"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button class="ctrl-btn" onclick="playNext()" title="Suivant">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Répéter">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
    <div class="player-progress">
      <span class="p-time" id="timeCurrent">0:00</span>
      <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0" step="0.1"
             oninput="seekTo(this.value)" style="--pct:0%">
      <span class="p-time" id="timeTotal">0:00</span>
    </div>
  </div>
  <div class="player-right">
    <button class="player-lyrics-btn" id="lyricsToggleBtn" onclick="toggleLyrics()" title="Paroles">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" title="Volume">
      <svg id="volIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </button>
    <input type="range" class="vol-bar" id="volBar" min="0" max="100" value="100" step="1"
           oninput="setVolume(this.value)" style="--pct:100%">
    <button class="ctrl-btn" onclick="stopPlayer()" title="Fermer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const IN_SHELL = window.parent !== window && typeof window.parent.gJouer === 'function';
const API = '';
let albumData  = null;
let artisteData = null;
let profilInfo  = {};
let pistes     = [];
let playIdx    = -1;
let nomArtiste = '';
let shuffleOn  = false;
let repeatMode = 'off';
let isMuted    = false;

// ── UTILS ──────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
async function get(path) {
  const r = await fetch(API + '/api' + path);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}
function dur(s) {
  if (!s && s !== 0) return '–';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}
function dureeTotal(sons) {
  const total = sons.reduce((a, s) => a + (s.duree || 0), 0);
  const m = Math.floor(total / 60), s = Math.floor(total % 60);
  if (m >= 60) return `${Math.floor(m/60)} h ${m%60} min`;
  return `${m} min ${s} sec`;
}

// ── SCROLL ─────────────────────────────────────────────────────────────────
window.addEventListener('scroll', () =>
  document.getElementById('topbar').classList.toggle('scrolled', scrollY > 200)
);

// ── COULEUR DOMINANTE depuis la cover ──────────────────────────────────────
function extraireCouleur(imgUrl) {
  return new Promise(resolve => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 1;
      c.getContext('2d').drawImage(img, 0, 0, 1, 1);
      const [r, g, b] = c.getContext('2d').getImageData(0,0,1,1).data;
      // Assombrir pour le fond
      resolve(`rgb(${Math.round(r*.45)},${Math.round(g*.45)},${Math.round(b*.45)})`);
    };
    img.onerror = () => resolve('#4a2040');
    img.src = imgUrl;
  });
}

// ── CHARGEMENT ─────────────────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(location.search);
  nomArtiste   = params.get('artiste') || '';
  if (IN_SHELL) document.body.classList.add('in-shell');
  const titreAlb = params.get('album') || '';

  if (!nomArtiste || !titreAlb) {
    document.body.innerHTML = '<div style="padding:100px 32px;color:#b3b3b3">Paramètres manquants — utilise ?artiste=...&album=...</div>';
    return;
  }

  try {
    artisteData = await get(`/artistes/${encodeURIComponent(nomArtiste)}/profil`);
  } catch(e) { toast('Erreur : ' + e.message); return; }

  albumData = artisteData.albums.find(a => a.titre === titreAlb);
  if (!albumData) { toast('Album introuvable'); return; }

  // Sons correspondant à cet album, dans l'ordre des pistes
  pistes = albumData.pistes.map(p => {
    const s = artisteData.sons.find(x => x.nom === p.nom);
    return s || { nom: p.nom, titre: p.titre, duree: 0 };
  }).filter(Boolean);

  render();
  renderMore();

  // Lien artiste dans la topbar
  document.getElementById('artisteLink').href = `/static/artiste.html?artiste=${encodeURIComponent(nomArtiste)}`;
}

async function render() {
  const type  = albumData.type || 'album';
  const label = { album: 'Album', ep: 'EP', single: 'Single' }[type] || 'Album';

  document.title = `${albumData.titre} — ${nomArtiste}`;

  // Type
  document.getElementById('heroType').textContent = label;

  // Titre
  document.getElementById('heroTitle').textContent = albumData.titre;

  // Cover
  const coverEl = document.getElementById('heroCover');
  if (albumData.cover) {
    coverEl.innerHTML = `<img src="${albumData.cover}" alt="" onerror="this.parentElement.innerHTML='💿'">`;
    // Fond cover en transparence
    const bg = document.getElementById('coverBg');
    bg.style.backgroundImage = `url('${albumData.cover}')`;
    bg.classList.add('visible');
    // Couleur dominante pour le hero
    const col = await extraireCouleur(albumData.cover);
    document.getElementById('hero').style.background = `linear-gradient(${col} 0%, rgba(18,18,18,0) 100%)`;
    document.documentElement.style.setProperty('--hero-color', col);
  }

  // Avatar artiste
  profilInfo = await get(`/artistes/${encodeURIComponent(nomArtiste)}/info`).catch(() => ({}));
  const avaEl = document.getElementById('heroAva');
  if (profilInfo.photo_avatar) {
    avaEl.innerHTML = `<img src="${profilInfo.photo_avatar}" alt="">`;
  }

  // Infos hero
  document.getElementById('heroArtist').textContent = profilInfo.nom_affiche || nomArtiste;
  document.getElementById('heroYear').textContent   = albumData.annee || '–';
  document.getElementById('heroCount').textContent  =
    `${pistes.length} titre${pistes.length !== 1 ? 's' : ''}, ${dureeTotal(pistes)}`;

  // Tracklist
  renderTracks();

  // Footer
  if (albumData.annee) {
    const footer = document.getElementById('releaseFooter');
    footer.style.display = '';
    document.getElementById('releaseDate').textContent =
      albumData.annee ? `${albumData.annee}` : '';
    document.getElementById('releaseCopy').innerHTML =
      `© ${albumData.annee || ''} ${nomArtiste}`;
  }
}

// ── COMPTEUR DE LECTURES ─────────────────────────────────────────────────────
function _getPlays(nom) {
  return parseInt(localStorage.getItem('plays_' + nom) || '0', 10);
}
function _incPlays(nom) {
  localStorage.setItem('plays_' + nom, _getPlays(nom) + 1);
}
function _fmtPlays(n) {
  if (n === 0) return '—';
  return n.toLocaleString('fr-FR');
}

function renderTracks() {
  document.getElementById('trackList').innerHTML = pistes.map((s, i) => {
    const plays = _getPlays(s.nom);
    return `
    <div class="track-row${playIdx === i ? ' playing' : ''}" data-i="${i}">
      <div class="track-num">${i+1}</div>
      <div class="track-play" onclick="play(${i})">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <div ondblclick="play(${i})" style="min-width:0">
        <div class="track-name">${s.titre || s.nom}</div>
        <div class="track-artist">${s.artiste || nomArtiste}</div>
      </div>
      <div class="track-plays${plays === 0 ? ' zero' : ''}">${_fmtPlays(plays)}</div>
      <div class="track-right">
        <button class="like-btn" onclick="this.classList.toggle('on')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <span class="duration">${dur(s.duree)}</span>
      </div>
    </div>`;
  }).join('');
}

function renderMore() {
  const autresAlbums = artisteData.albums.filter(a => a.titre !== albumData.titre);
  if (!autresAlbums.length) return;

  document.getElementById('moreSection').style.display = '';
  document.getElementById('moreTitle').textContent = `Plus de ${nomArtiste}`;
  document.getElementById('seeAllLink').href = `/static/artiste.html?artiste=${encodeURIComponent(nomArtiste)}`;

  document.getElementById('moreScroll').innerHTML = autresAlbums.map(a => {
    const type  = a.type || 'album';
    const badge = { album: 'Album', ep: 'EP', single: 'Single' }[type] || 'Album';
    return `<div class="more-card" onclick="ouvrirAlbum('${encodeURIComponent(a.titre)}')">
      <div class="more-cover">
        ${a.cover ? `<img src="${a.cover}" onerror="this.parentElement.innerHTML='💿'" loading="lazy" alt="">` : '💿'}
        <button class="more-play" onclick="event.stopPropagation();jouerAlbumExterne('${encodeURIComponent(a.titre)}')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
      </div>
      <div class="more-name">${a.titre}</div>
      <div class="more-year">${a.annee || '–'} · <span class="type-badge ${type}">${badge}</span></div>
    </div>`;
  }).join('');
}

function ouvrirAlbum(titreEnc) {
  window.location.href = `?artiste=${encodeURIComponent(nomArtiste)}&album=${titreEnc}`;
}

function allerArtiste() {
  window.location.href = `/static/artiste.html?artiste=${encodeURIComponent(nomArtiste)}`;
}

// ── LECTURE ──────────────────────────────────────────────────────────────────
const audio = document.getElementById('audio');

function play(i) {
  const s = pistes[i]; if (!s) return;
  _incPlays(s.nom);
  if (IN_SHELL) {
    playIdx = i;
    window.parent.gJouer(pistes, i, { nom: nomArtiste });
    renderTracks();
    return;
  }
  playIdx = i;
  audio.src = s.audio_url || `/api/fichiers/${encodeURIComponent(s.nom)}`;
  document.getElementById('playerTitle').textContent  = s.titre || s.nom;
  document.getElementById('playerArtist').textContent = s.artiste || nomArtiste;
  const th = document.getElementById('playerThumb');
  th.innerHTML = s.cover_url
    ? `<img src="${s.cover_url}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='🎵'" alt="">`
    : '🎵';
  if (lyricsOpen) { chargerLyrics(s.nom); _updateLyricsNP(s); }
  document.getElementById('playerBar').classList.add('on');
  audio.play();
  _setPPIcon(false);
  renderTracks();
}

function jouerTout()      { if (pistes.length) play(0); }
function jouerAleatoire() { if (pistes.length) play(Math.floor(Math.random()*pistes.length)); }

function togglePlay() {
  if (audio.paused) { audio.play(); _setPPIcon(false); }
  else              { audio.pause(); _setPPIcon(true); }
}
function playNext() {
  if (!pistes.length) return;
  if (shuffleOn) { play(Math.floor(Math.random()*pistes.length)); return; }
  if (playIdx < pistes.length - 1) play(playIdx + 1);
  else if (repeatMode === 'all') play(0);
}
function playPrev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (playIdx > 0) play(playIdx - 1);
  else audio.currentTime = 0;
}
function stopPlayer() {
  audio.pause();
  document.getElementById('playerBar').classList.remove('on');
}
function toggleShuffle() {
  shuffleOn = !shuffleOn;
  document.getElementById('shuffleBtn').classList.toggle('active', shuffleOn);
}
function toggleRepeat() {
  repeatMode = { off: 'all', all: 'one', one: 'off' }[repeatMode];
  document.getElementById('repeatBtn').classList.toggle('active', repeatMode !== 'off');
}
function toggleMute() {
  isMuted = !isMuted; audio.muted = isMuted;
  const icon = document.getElementById('volIcon');
  icon.innerHTML = isMuted
    ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="none" stroke="currentColor" stroke-width="2"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2"/>'
    : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
}
function setVolume(v) {
  audio.volume = v / 100;
  document.getElementById('volBar').style.setProperty('--pct', v + '%');
}
function seekTo(pct) {
  if (audio.duration) audio.currentTime = (pct / 100) * audio.duration;
}
function _fmt(s) {
  if (!s && s !== 0) return '0:00';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}
function _setPPIcon(paused) {
  document.getElementById('ppIcon').innerHTML = paused
    ? '<polygon points="5 3 19 12 5 21 5 3"/>'
    : '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
}

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  const bar = document.getElementById('progressBar');
  bar.value = pct;
  bar.style.setProperty('--pct', pct + '%');
  document.getElementById('timeCurrent').textContent = _fmt(audio.currentTime);
  document.getElementById('timeTotal').textContent   = _fmt(audio.duration);
  if (lyricsOpen) syncLyrics();
});
audio.addEventListener('play',  () => _setPPIcon(false));
audio.addEventListener('pause', () => _setPPIcon(true));
audio.addEventListener('ended', () => {
  if (repeatMode === 'one') { audio.currentTime = 0; audio.play(); return; }
  playNext();
});

// ── PAROLES ──────────────────────────────────────────────────────────────────
let lyricsOpen = false, lrcLines = [], lastLrcIdx = -1;

function _parseLRC(text) {
  const lines = []; const re = /^\[(\d{2}):(\d{2})[.:](\d{2,3})\](.*)/;
  for (const l of text.split('\n')) {
    const m = l.match(re);
    if (m) {
      const frac = m[3].length === 3 ? +m[3]/1000 : +m[3]/100;
      lines.push({ t: +m[1]*60 + +m[2] + frac, txt: m[4] || '' });
    } else if (l.trim() && lines.length) lines[lines.length-1].txt += '\n' + l;
  }
  return lines;
}

async function chargerLyrics(nomFichier) {
  const content = document.getElementById('lyricsContent');
  content.innerHTML = '<div style="color:rgba(255,255,255,.5);padding:60px 0;text-align:center">Chargement…</div>';
  lrcLines = []; lastLrcIdx = -1;
  try {
    const r = await fetch(`/api/fichiers/${encodeURIComponent(nomFichier)}/lyrics`);
    if (!r.ok) throw new Error();
    const { lyrics } = await r.json();
    lrcLines = _parseLRC(lyrics);
    if (lrcLines.length) {
      content.innerHTML = '';
      lrcLines.forEach((l, i) => {
        const div = document.createElement('div');
        div.className = 'lrc-line'; div.dataset.i = i;
        div.style.whiteSpace = 'pre-wrap';
        div.textContent = l.txt.trim() || '♪';
        if (!l.txt.trim()) div.style.opacity = '.3';
        div.onclick = () => { audio.currentTime = l.t; audio.play(); };
        content.appendChild(div);
      });
      syncLyrics();
    } else {
      content.innerHTML = `<div style="color:rgba(255,255,255,.5);font-size:1.1rem;text-align:center;padding:60px 20px">${lyrics.slice(0,2000)}</div>`;
    }
  } catch { content.innerHTML = '<div style="color:rgba(255,255,255,.5);font-size:1.1rem;text-align:center;padding:60px 20px">Paroles non disponibles</div>'; }
}

function syncLyrics() {
  const t = audio.currentTime;
  let idx = -1;
  for (let i = 0; i < lrcLines.length; i++) { if (lrcLines[i].t <= t) idx = i; else break; }
  if (idx === lastLrcIdx) return;
  lastLrcIdx = idx;
  document.querySelectorAll('.lrc-line').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
    el.classList.toggle('passe', i < idx);
  });
  if (idx >= 0) {
    const el = document.querySelector(`.lrc-line[data-i="${idx}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function toggleLyrics() {
  lyricsOpen = !lyricsOpen;
  document.getElementById('lyricsFs').classList.toggle('on', lyricsOpen);
  document.getElementById('lyricsToggleBtn').classList.toggle('on', lyricsOpen);
  if (lyricsOpen && playIdx >= 0) {
    const s = pistes[playIdx];
    chargerLyrics(s.nom);
    _updateLyricsNP(s);
  }
}

function _updateLyricsNP(s) {
  document.getElementById('lyricsNpArtist').textContent = s.artiste || nomArtiste;
  document.getElementById('lyricsNpTitle').textContent  = s.titre || s.nom;
  document.getElementById('lyricsNpSub').textContent    = s.artiste || nomArtiste;
  const cover = document.getElementById('lyricsNpCover');
  cover.innerHTML = s.cover_url
    ? `<img src="${s.cover_url}" onerror="this.parentElement.innerHTML='💿'" alt="">`
    : '💿';
  // About artist
  document.getElementById('lyricsNpName').textContent = profilInfo.nom_affiche || nomArtiste;
  const avatarEl = document.getElementById('lyricsNpAvatar');
  if (profilInfo.photo_avatar) {
    avatarEl.innerHTML = `<img src="${profilInfo.photo_avatar}" alt="" style="width:100%;height:100%;object-fit:cover">`;
  }
  const bio = profilInfo.bio || '';
  document.getElementById('lyricsNpBio').textContent = bio || 'Artiste indépendant.';
}

function jouerAlbumExterne(titreEnc) {
  const alb = artisteData.albums.find(a => a.titre === decodeURIComponent(titreEnc));
  if (!alb || !alb.pistes.length) return;
  setTimeout(() => ouvrirAlbum(titreEnc), 80);
}

// ── INIT ─────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
